name: Website

# Rebuilds the GitHub Pages site after every daily scan, and whenever the code changes.
# Pages is free for public repos. Turn it on once: Settings → Pages → Source: GitHub Actions.

on:
  workflow_run:
    workflows: ["Daily scan"]
    types: [completed]
  push:
    branches: [main]
    paths: ["src/**", "web/**", "scout.config.json", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # After a scan, build from the commit the scan just pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: node src/cli.ts site --url "${{ steps.pages.outputs.base_url }}" --out public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
